[Display]
Borderless = 1                  // Borderless windowed at the desktop resolution, using the engine's own unused -borderless switch.
MaxFrameRate = 120              // Caps the game's frame rate using the built-in engine limiter. 0 = uncapped (default).

[Graphics]
AnisotropicFiltering = 16       // Forces the selected AF level on all textures. 0 uses the game's inconsistent per-quality defaults.
Xbox360Gamma = 1                // Restores the Xbox 360's darker gamma look with deeper blacks and stronger contrast. Applies to the full frame.
EnhancedLODs = 1                // Improves LODs across the board. Only affects the Ultra High preset. 0 is stock
EnhancedShadowRange = 1         // Improves shadow draw distance. Only affects the Ultra High preset. 0 is stock
ShadowResolution = 2048         // Resolution of the sun and cascaded shadow maps, range is 128 to 2560. 2048 is stock Ultra High.

[Gameplay]
RemoveMouseSpeedCap = 1         // Removes the input filter's maxOutput ceiling, which saturates fast mouse movement. Mouse only, gamepad untouched
MouseLookSensitivity = 1.0      // Mouse look speed, on top of the in-game slider and past its ceiling. 1.0 is stock, range 0.01 to 5.0. Gamepad is untouched - it has its own under [Controller]
SprintTurnModifier = 0          // Replaces fSprintingTurnModifier, which throttles horizontal look speed while sprinting. 1.0 removes the limit, 0 keeps the game's own value. Vertical is never affected
AimToggle = 1                   // Tap aim to stay in ironsights, tap again to lower them. Holding the button keeps you aiming until you let go
SprintToggle = 1                // Tap sprint to toggle sprint, tap again to stop or let go of the directional key. Holding the button keeps you sprinting until you let go
LimitedSaving = 0               // Console style saving: removes Save Game from the pause menu and stops F5/F9 quicksave and quickload. Beds and autosaves are untouched
ConsoleAutosaves = 1            // Console style autosaves: save box appears after completing a mission
NoBlinkingItems = 0             // Stops interactable things from flashing at you: weapons, ammo and health boxes, diamond cases, beds, etc
NoColoredSigns = 0              // Removes sign color with an active objective

[FieldOfView]
FieldOfView = 91.31             // The game's base FOV in degrees. Stock is 75, range 45 to 140. Does not affect ironsights or scopes
ViewmodelFieldOfView = 75.0     // First person weapon and arms. Stock is 75, keep it near 75 to stop the gun stretching at a wider FieldOfView
IronsightFieldOfView = 59.85    // Aim down sights FOV | Default none widescreen value: 46.70 | Default widescreen value: 59.85 | Range 20 to 140. Magnified optics are skipped, so sniper scopes keep their zoom.
VehicleFieldOfView = 91.31      // FOV while driving, in degrees. 0 leaves the game's own value alone, which is stock. Range 45 to 140. Applies on the next load

[Controller]
ControllerLookSensitivity = 1.0 // Gamepad look speed, on top of the in-game slider and past its ceiling. 1.0 is stock, range 0.01 to 5.0. Mouse is untouched - the two are fully independent
AimAssist = 1                   // 1 is stock. 0 turns off the gamepad aim assist: sticky aim, enemy following, shot correction and the aim down sights snap. Mouse is unaffected, it has none of this
Vibration = 1                   // Restores controller vibration, which the PC build hands two hardcoded zeros instead of the rumble curves.
AimToggle = 1                   // Tap aim to stay in ironsights, tap again to lower them. Holding the button keeps you aiming until you let go

[ContentUnlocks]
PredecessorTapesUnlock = 1      // Unlocks the 7 predecessor tape missions, gated behind a dead online entitlement check
MachetesUnlock = 1              // Unlocks the Primitive and Homemade machete skins, gated behind a dead promotion

[General]
SkipIntro = 1                   // Skips the Ubisoft, Dunia, and rating screens
SkipTitleScreen = 1             // Skips the "Press any key" title screen and boots straight to the main menu
CpuAffinity = 0                 // Limits the game to the first N logical processors. 0 uses all CPUs (default).
HighPrecisionTimer = 1          // Asks Windows for 1ms timer resolution, so the loading screen reaches the proper 30 FPS.
SkipSystemDetection = 1         // Skips redundant hardware detection, making game startup up much faster.
LargeAddressAware = 0           // Offers to flag the game's exe as large address aware, raising its 2GB memory cap to 4GB. Keeps a .bak, and needs a restart.
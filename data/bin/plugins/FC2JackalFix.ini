[Display]
DisplayMode = 2                 // (1) Fullscreen, (2) Borderless, (3) Windowed.
InternalResolutionX = 0         // Sets the internal game ResX without it affecting the window resolution, useful for supersampling and downscaling. Console ResX: 1280.
InternalResolutionY = 0         // Sets the internal game ResY without it affecting the window resolution, useful for supersampling and downscaling. Console ResY: 696.
ScalingFilter = 1               // How the internal frame is scaled to the output, (0) point, (1) bilinear.
MaxFrameRate = 1                // Caps the game's frame rate using the built-in engine limiter. (0) unlocked, (1) the monitor's refresh rate
FpsCounter = 0                  // Shows the engine's built-in frame rate counter.

[Graphics]
ImprovedUtilisation = 1         // Improves GPU and CPU utilisation, increasing performance across the board.
AnisotropicFiltering = 16       // Forces the selected AF level on all textures. 0 uses the game's inconsistent per-quality defaults.
NoRimLighting = 0               // Removes the rim lighting glow on the edges of characters, mainly visible at night.
Saturation = 0.5                // Adjust the saturation levels from the 0.5 default, rage: 0.0 - 1.0.

[BeyondUltra]
BeyondUltraGeometry = 0         // Increases past the Ultra High geometry values: (0) default, (1) 2x, (2) 4x, (3) 6x, (4) max draw distance.
BeyondUltraShadows = 0          // Increases past the Ultra High shadow values: (0) default, (1) max draw distance.
BeyondUltraTerrain = 0          // Increases past the Ultra High terrain values: (0) default, (1) 2x, (2) 4x, (3) max draw distance.

[Gameplay]
RemoveMouseSpeedCap = 1         // Removes the input filter's maxOutput ceiling, which saturates fast mouse movement.
MouseLookSensitivity = 1.0      // Mouse look speed, on top of the in-game slider and past its ceiling. 1.0 is stock, range 0.01 to 5.0.
SprintTurnModifier = 1          // Disables horizontal sensitivity being lowered when sprinting.
AimToggle = 1                   // Tap aim to stay in ironsights, tap again to lower them. Holding the button keeps you aiming until you let go.
SprintToggle = 1                // Tap sprint to toggle sprint, tap again to stop or let go of the directional key. Holding the button keeps you sprinting until you let go.
LimitedSaving = 0               // Console style saving: removes Save Game from the pause menu and stops F5/F9 quicksave and quickload. Beds and autosaves are untouched.
ConsoleAutosaves = 1            // Console style autosaves: save box appears after completing a mission.
NoBlinkingItems = 0             // Stops interactable things from flashing at you: weapons, ammo and health boxes, diamond cases, beds, etc.
NoHitIndicator = 0              // Disables the directional hit indicators.

[FieldOfView]
FieldOfView = 91.31             // The game's base FOV in degrees. Stock is 75, range 45 to 140. Does not affect ironsights or scopes.
ViewmodelFieldOfView = 75.0     // First person weapon and arms. Stock is 75, keep it near 75 to stop the gun stretching or seeing animation bugs at a wider FieldOfView.
IronsightFieldOfView = 59.85    // Aim down sights FOV | Default none widescreen value: 46.70 | Default widescreen value: 59.85 | Range 20 to 140. Magnified optics are skipped, so sniper scopes keep their zoom.
VehicleFieldOfView = 91.31      // FOV while driving, in degrees. 0 leaves the game's own value alone, which is stock. Range 45 to 140. Applies on the next load.

[Controller]
ControllerLookSensitivity = 1.0 // Gamepad look speed, on top of the in-game slider and past its ceiling. 1.0 is stock, range 0.01 to 5.0.
AimAssist = 1                   // 1 is stock. 0 turns off the gamepad aim assist.
Vibration = 1                   // Restores controller vibration.
ControllerPrompts = 1           // Restores the Xbox 360 button prompts. 
AimToggle = 1                   // Tap aim to stay in ironsights, tap again to lower them. Holding the button keeps you aiming until you let go.

[ContentUnlocks]
PredecessorTapesUnlock = 1      // Unlocks the 7 predecessor tape missions, gated behind a dead online entitlement check.
MachetesUnlock = 1              // Unlocks the Primitive and Homemade machete skins, gated behind a dead promotion.

[General]
SkipIntro = 1                   // Skips the Ubisoft, Dunia, and rating screens.
SkipTitleScreen = 1             // Skips the "Press any key" title screen and boots straight to the main menu.
SkipTutorials = 0               // Skips tutorial messages: (0) default, (1) the pop-ups that interrupt gameplay, (2) also the floating on-screen hints.
CpuAffinity = 0                 // Limits the game to the first N logical processors. 0 uses all CPUs (default).
HighPrecisionTimer = 1          // Asks Windows for 1ms timer resolution, so the loading screen reaches the proper 30 FPS.
SkipSystemDetection = 1         // Skips redundant hardware detection, making game startup up much faster.
LargeAddressAware = 1           // Offers to flag the game's exe as large address aware, raising its 2GB memory cap to 4GB. Keeps a .bak, and needs a restart.

[Debug]
